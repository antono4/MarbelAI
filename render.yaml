# Render Blueprint — deploy backend Marbel AI satu deploy.
# Cara pakai: buat "New Blueprint" di Render, hubungkan repo ini — Render membuat service di atas.
# UPSTREAM menunjuk ke endpoint OpenAI-compatible "Zen" (opencode.ai/zen/v1), gratis dan tanpa API key.
services:
  - type: web
    name: marbel-ai
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      # UPSTREAM: endpoint OpenAI-compatible (Zen — opencode.ai/zen/v1), gratis tanpa API key.
      - key: UPSTREAM
        value: https://opencode.ai/zen
      - key: API_KEY
        sync: false
      # Z.ai (GLM): upstream cadangan opsional untuk model Z.ai — isi ZAI_API_KEY
      # di dashboard Render bila ingin model GLM ikut melayani.
      - key: ZAI_UPSTREAM
        value: https://api.z.ai/api/paas/v4
      - key: ZAI_API_KEY
        sync: false
      - key: ALLOW_ORIGIN
        value: "*"
      - key: USE_SSE
        value: "0"
      # DoLa (arXiv:2309.03883): kontras logprobs dua model untuk faktualitas.
      # Butuh ZAI_API_KEY agar model mature (GLM) melayani.
      - key: DOLA_ENABLED
        value: "0"
      - key: DOLA_MATURE_MODEL
        value: glm-4.7-flash
      - key: DOLA_PREMATURE_MODEL
        value: ling-3.0-flash-fin-free
      - key: DOLA_ALPHA
        value: "0.1"
      - key: DOLA_REPETITION_PENALTY
        value: "1.2"


