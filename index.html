<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marbel AI — Chat AI</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar">
      <div class="side-top">
        <button class="new-thread" id="newThread">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>New Thread</span>
        </button>
        <div class="conv-head">
          <span>Conversations</span>
          <ul id="threadList" class="thread-list"></ul>
        </div>
      </div>
      <div class="side-bottom">
        <div class="status-row">
          <span id="statusDot" class="dot"></span>
          <span id="statusLabel">menghubungkan…</span>
        </div>
        <button class="side-btn" id="sideToggle" title="Sembunyikan/tampilkan sidebar">☰</button>
      </div>
    </aside>

    <!-- ============ Main ============ -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M9 4v5"/></svg>
          <span class="logo-name">Marbel AI</span>
          <span class="logo-role">AI Engineer</span>
        </div>
      </header>

      <div class="workspace">
      <div id="threadWrap" class="thread-wrap">
        <!-- Welcome screen (hidden once a chat is active) -->
        <div id="welcome" class="welcome">
          <div class="welcome-inner">
            <h2>Mari mulai berkarya</h2>
            <p class="welcome-sub">
              Mengobrol dengan beragam model AI gratis lewat Marbel AI. Pilih topik<br/>
              di bawah, atau langsung tulis pertanyaan Anda.
            </p>
            <div class="slider">
              <div class="track" id="suggestions">
                <!-- set 1 -->
                <button data-prompt="Tanyakan apa saja — ilmu, ide, atau hal sehari-hari">
                  <span class="sc">💡</span>Tanyakan apa saja
                </button>
                <button data-prompt="Bantu tulis, rapikan, atau jelaskan sesuatu">
                  <span class="sc">✍️</span>Bantu tulis, rapikan, atau jelaskan
                </button>
                <button data-prompt="Ringkas artikel, dokumen, atau ide panjang">
                  <span class="sc">📝</span>Ringkas artikel, dokumen, atau ide
                </button>
                <button data-prompt="Terjemahkan, carikan fakta, atau jelaskan istilah">
                  <span class="sc">🔍</span>Terjemahkan atau carikan fakta
                </button>
                <button data-prompt="Tulis ide cerita atau konsep kreatif baru">
                  <span class="sc">🎨</span>Tulis ide kreatif baru
                </button>
                <button data-prompt="Buatkan tugas sekolah atau materi belajar yang mudah dipahami">
                  <span class="sc">📚</span>Bantu tugas sekolah &amp; belajar
                </button>
                <button data-prompt="Jelaskan langkah-langkah memasak atau resep yang mudah diikuti">
                  <span class="sc">🍳</span>Ide resep &amp; memasak
                </button>
                <button data-prompt="Bantu atur jadwal, prioritas, atau daftar kegiatan harian">
                  <span class="sc">🗓️</span>Atur jadwal &amp; prioritas
                </button>
                <button data-prompt="Sarankan ide hobi, olahraga, atau kegiatan menyenangkan">
                  <span class="sc">⚽</span>Ide hobi &amp; kegiatan
                </button>
                <button data-prompt="Tulis doa, kata-kata penyemangat, atau pesan yang tulus untuk orang tersayang">
                  <span class="sc">💌</span>Kata-kata &amp; pesan tulus
                </button>
                <!-- set 2 (duplikat untuk loop mulus) -->
                <button data-prompt="Tanyakan apa saja — ilmu, ide, atau hal sehari-hari" aria-hidden="true">
                  <span class="sc">💡</span>Tanyakan apa saja
                </button>
                <button data-prompt="Bantu tulis, rapikan, atau jelaskan sesuatu" aria-hidden="true">
                  <span class="sc">✍️</span>Bantu tulis, rapikan, atau jelaskan
                </button>
                <button data-prompt="Ringkas artikel, dokumen, atau ide panjang" aria-hidden="true">
                  <span class="sc">📝</span>Ringkas artikel, dokumen, atau ide
                </button>
                <button data-prompt="Terjemahkan, carikan fakta, atau jelaskan istilah" aria-hidden="true">
                  <span class="sc">🔍</span>Terjemahkan atau carikan fakta
                </button>
                <button data-prompt="Tulis ide cerita atau konsep kreatif baru" aria-hidden="true">
                  <span class="sc">🎨</span>Tulis ide kreatif baru
                </button>
                <button data-prompt="Buatkan tugas sekolah atau materi belajar yang mudah dipahami" aria-hidden="true">
                  <span class="sc">📚</span>Bantu tugas sekolah &amp; belajar
                </button>
                <button data-prompt="Jelaskan langkah-langkah memasak atau resep yang mudah diikuti" aria-hidden="true">
                  <span class="sc">🍳</span>Ide resep &amp; memasak
                </button>
                <button data-prompt="Bantu atur jadwal, prioritas, atau daftar kegiatan harian" aria-hidden="true">
                  <span class="sc">🗓️</span>Atur jadwal &amp; prioritas
                </button>
                <button data-prompt="Sarankan ide hobi, olahraga, atau kegiatan menyenangkan" aria-hidden="true">
                  <span class="sc">⚽</span>Ide hobi &amp; kegiatan
                </button>
                <button data-prompt="Tulis doa, kata-kata penyemangat, atau pesan yang tulus untuk orang tersayang" aria-hidden="true">
                  <span class="sc">💌</span>Kata-kata &amp; pesan tulus
                </button>
              </div>
            </div>
            <div class="model-section">
              <div class="ms-head">
                <span class="ms-title">Semua Model</span>
                <span id="modelCount" class="ms-count">memuat…</span>
              </div>
              <div id="modelNames" class="model-list" role="list"></div>
            </div>
          </div>
        </div>

        <!-- Chat area -->
        <div id="messages" class="messages"></div>
        <div id="activeBadge" class="active-badge">
          <span class="working"></span> Marbel AI is working <span class="bsp">●●●</span>
        </div>
      </div>
      </div><!-- /.workspace -->

      <!-- ============ Composer ============ -->
      <form id="form" class="composer" autocomplete="off">
        <div class="composer-header">
          <button type="button" class="attach" id="attachBtn" title="Lampiran">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.4 11.05 12.25 20.2a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24L9.5 17.4a1 1 0 0 1-1.42-1.42l8.5-8.48"/></svg>
            <span>Lampiran</span>
          </button>
          <span class="spacer"></span>
        </div>
        <textarea id="input" rows="3" placeholder="What do you want to build?" aria-label="Pesan"></textarea>
        <div class="composer-footer">
          <div class="cf-left">
            <label class="custom-select">
              <span class="cs-label">Model</span>
              <select id="model">
                <option value="oc/mimo-v2.5-free">oc/mimo-v2.5-free</option>
                <option value="oc/hy3-free">oc/hy3-free</option>
                <option value="oc/nemotron-3.5-lightning-free">oc/nemotron-3.5-lightning-free</option>
                <option value="oc/laguna-s-2.1-free">oc/laguna-s-2.1-free</option>
                <option value="oc/big-pickle">oc/big-pickle</option>
              </select>
            </label>
          </div>
          <button id="send" type="submit" class="send" title="Kirim">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
